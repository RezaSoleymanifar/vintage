[project]
name = "vintage-mcp"
version = "0.2.0"
description = "A research terminal that costs $0 and won't lie to you about your Sharpe — point-in-time financial data over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reza Soleymanifar", email = "reza@soleymanifar.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "finance",
    "quant",
    "backtesting",
    "point-in-time",
    "sec-edgar",
    "fred",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/RezaSoleymanifar/vintage"
Repository = "https://github.com/RezaSoleymanifar/vintage"
Issues = "https://github.com/RezaSoleymanifar/vintage/issues"

[project.scripts]
vintage = "vintage.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vintage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: hits a live upstream source; deselect with -m 'not network'",
]
