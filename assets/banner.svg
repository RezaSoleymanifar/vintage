<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Vintage - a research terminal that costs zero dollars and won't lie to you about your Sharpe">
  <title>Vintage</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="55%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35e08a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#35e08a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35e08a" stop-opacity="0"/>
      <stop offset="18%" stop-color="#35e08a" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#35e08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#35e08a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="known"><rect id="curtain" x="0" y="0" width="0" height="420"/></clipPath>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="420" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
    #curtain { animation: sweep 7s cubic-bezier(.45,0,.15,1) infinite; }
    .sweeper { animation: slide 7s cubic-bezier(.45,0,.15,1) infinite; }
    .stamp    { animation: stamp 7s linear infinite; }
    .stampx   { animation: flip 7s steps(1,end) infinite; }
    .flicker  { animation: flicker 7s steps(1,end) infinite; }
    @keyframes sweep  { 0% {width:60px} 8% {width:60px} 72% {width:1160px} 100% {width:1160px} }
    @keyframes slide  { 0% {transform:translateX(60px)} 8% {transform:translateX(60px)} 72% {transform:translateX(1160px)} 100% {transform:translateX(1160px)} }
    @keyframes stamp  { 0%,8% {opacity:0} 12% {opacity:1} 70% {opacity:1} 78%,100% {opacity:0} }
    @keyframes flip   { 0%,52% {transform:translateX(10px)} 56%,100% {transform:translateX(-162px)} }
    @keyframes flicker{ 0%,74% {opacity:0} 78% {opacity:1} 100% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      #curtain { animation: none; width: 1160px; }
      .sweeper { animation: none; transform: translateX(1160px); }
      .stamp { animation: none; opacity: 0; }
      .flicker { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
